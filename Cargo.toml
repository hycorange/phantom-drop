[package]
name = "phantom-drop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Phantom Drop: haunted claim links for stealth TARI on Tari Ootle"
rust-version = "1.97"

[lib]
name = "phantom_drop"
path = "src/lib.rs"

[[bin]]
name = "phantom"
path = "src/main.rs"

[dependencies]
ootle-rs = "0.26"
tari_ootle_transaction = "0.45"
tari_crypto = "0.24"
ootle_byte_type = { version = "0.16", features = ["crypto"] }
argon2 = "0.5"
blake2 = "0.10"
bech32 = "0.11"
rand = "0.9"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
zeroize = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tari_ootle_common_types = "0.45"

tari_template_test_tooling = { version = "0.45", optional = true }

[features]
default = []
# In-process Ootle engine simulator (used by the tests and the `haunted_demo` example).
sim = ["dep:tari_template_test_tooling"]

[dev-dependencies]
phantom-drop = { path = ".", features = ["sim"] }
tari_template_test_tooling = "0.45"

[[example]]
name = "haunted_demo"
required-features = ["sim"]
